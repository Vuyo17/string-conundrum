name: Deploy (Self-Hosted Runner)

on:
  push:
    # `production` is the deploy branch. `main` was also listed but does not
    # exist in this repository, so it never fired.
    branches: [production]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy-self-hosted.yml'
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]
    environment: production
    env:
      APP_DIR: /localhome/mtmluv001/string-conundrum-api
      WEB_ROOT: /var/www/stringcon
      API_SERVICE: string-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runtime versions
        run: |
          set -euo pipefail
          python3 --version
          node --version
          npm --version

      - name: Build frontend
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Deploy backend and frontend
        shell: bash
        env:
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail

          run_sudo() {
            if [ -n "${SUDO_PASSWORD:-}" ]; then
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' "$@"
            else
              sudo "$@"
            fi
          }

          # Sync backend code to the path used by the systemd service.
          #
          # .env is excluded from the delete sweep: it is gitignored, so it is
          # never in the source tree, and a plain --delete wiped it here before
          # the fallback below could read it — making that fallback, and the
          # error message advertising it, impossible to satisfy.
          mkdir -p "$APP_DIR/backend"
          rsync -az --delete --exclude='.env' backend/ "$APP_DIR/backend/"

          # Ensure backend virtualenv exists and dependencies are current.
          if [ ! -d "$APP_DIR/venv" ]; then
            python3 -m venv "$APP_DIR/venv"
          fi
          "$APP_DIR/venv/bin/pip" install --upgrade pip
          "$APP_DIR/venv/bin/pip" install -r "$APP_DIR/backend/requirements.txt"

          # Apply the schema and re-seed content BEFORE restarting the service.
          #
          # This step did not exist, so a deploy shipped code that could query
          # columns the live database did not have yet, and content edited in
          # exercises.json/challenges.json never reached students — the app
          # reads both from Postgres, not from the JSON files.
          #
          # Both commands are idempotent: schema.sql is CREATE TABLE IF NOT
          # EXISTS plus ALTER TABLE ADD COLUMN IF NOT EXISTS, and the seeder
          # upserts by primary key, COALESCEing translations so it never wipes
          # one that is already in the table.
          # A malformed DATABASE_URL is worse than a missing one. psql treats
          # anything without a postgresql:// scheme as a bare database name,
          # connects over the local socket as the runner's own OS user, and
          # dies with `role "mtmluv001" does not exist` — which is what broke
          # every deploy from 2026-08-09 onward, once a bad value was added as
          # an environment secret. The secret is non-empty, so the emptiness
          # check below passed and the good .env was never consulted.
          #
          # So: validate the shape, not just the presence. Anything that is not
          # a postgres URI is treated as unset, which lets the on-disk .env win.
          valid_dsn() {
            case "${1:-}" in
              postgresql://*|postgres://*) return 0 ;;
              *) return 1 ;;
            esac
          }

          if ! valid_dsn "${DATABASE_URL:-}"; then
            if [ -n "${DATABASE_URL:-}" ]; then
              echo "Ignoring DATABASE_URL: not a postgresql:// URI." >&2
            fi
            DATABASE_URL=""
          fi

          if [ -z "$DATABASE_URL" ] && [ -f "$APP_DIR/backend/.env" ]; then
            # shellcheck disable=SC1091
            set -a; . "$APP_DIR/backend/.env"; set +a
          fi

          # The .env can hold a malformed value too, so re-check after sourcing
          # rather than trusting it.
          if ! valid_dsn "${DATABASE_URL:-}"; then
            echo "No usable DATABASE_URL. It must be a full connection URI, e.g." >&2
            echo "  postgresql://user:pass@127.0.0.1:5432/string_conundrum" >&2
            echo "Set it as a secret on the production environment, or put it in" >&2
            echo "$APP_DIR/backend/.env. Refusing to restart: the new code expects" >&2
            echo "columns this database may lack." >&2
            exit 1
          fi
          psql "$DATABASE_URL" -f "$APP_DIR/backend/db/schema.sql"
          (cd "$APP_DIR/backend" && "$APP_DIR/venv/bin/python" db/migrate_json_to_db.py)

          # Sync built frontend assets to Nginx web root.
          run_sudo mkdir -p "$WEB_ROOT"
          run_sudo rsync -az --delete frontend/dist/ "$WEB_ROOT/"
          run_sudo find "$WEB_ROOT" -type d -exec chmod 755 {} \;
          run_sudo find "$WEB_ROOT" -type f -exec chmod 644 {} \;

          # Reload services.
          run_sudo systemctl restart "$API_SERVICE"
          run_sudo systemctl reload nginx

      - name: Smoke checks
        run: |
          set -euo pipefail

          for i in {1..20}; do
            if curl -fsS http://127.0.0.1/health >/dev/null; then
              break
            fi
            sleep 2
          done

          for i in {1..20}; do
            if curl -fsS -X POST http://127.0.0.1/api/visualize \
              -H 'Content-Type: application/json' \
              -d '{"expression":"word[1:4]","context":{"word":"python"}}' >/dev/null; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1/health
          curl -fsS -X POST http://127.0.0.1/api/visualize \
            -H 'Content-Type: application/json' \
            -d '{"expression":"word[1:4]","context":{"word":"python"}}'

          # The checks above never touch Postgres, so they stay green even when
          # the schema is behind the code. These two do read it, and in both
          # languages, which is what catches a missing _xh column.
          curl -fsS 'http://127.0.0.1/api/challenges?lang=xh' >/dev/null
          curl -fsS 'http://127.0.0.1/api/exercises/intro?lang=xh' >/dev/null
          echo "database-backed endpoints OK in both languages"
