name: CI

# This repository's branches are master and production. The workflow previously
# triggered on `main`, which does not exist here, so CI had never run on any
# push or pull request.
on:
  push:
    branches: [master, production]
  pull_request:
    branches: [master, production]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The app reads exercises, challenges and progress from Postgres, so the
    # suite needs a real database — without one, every DB-backed test fails on
    # "DATABASE_URL is not set" rather than on anything it meant to assert.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: string_conundrum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/string_conundrum_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create schema and seed content
        # Both are idempotent, and mirror the setup documented in backend/README.md.
        run: |
          psql "$DATABASE_URL" -f db/schema.sql
          python db/migrate_json_to_db.py
      - name: Run tests
        run: pytest

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
